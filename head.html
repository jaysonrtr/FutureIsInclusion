<!--
  Shared head tags. script.js inserts anything this file contains that the page
  does not already have. Each page also includes these tags directly, so the site
  still has fonts, CSS, and an icon when this file cannot be fetched (including file://).
  Page titles and descriptions stay in each HTML file.
-->
<meta name="theme-color" content="#f9f5e6">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon.png">
